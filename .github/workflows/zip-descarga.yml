# Arma los ZIP de descarga y los sube a la Release.
#
# El boton del README apunta a
#   .../CineConIA-Installer-Windows.zip
#   .../CineConIA-Installer-Linux.zip
#   .../CineConIA-Installer-macOS.zip
# Cada boton del README apunta al ZIP propio de su plataforma.
#
# El ZIP sale de "git archive": respeta export-ignore de .gitattributes, asi
# que lleva solo lo necesario para instalar, y los .bat quedan con CRLF.
#
# Cuando corre:
#   - al subir una etiqueta vX.Y.Z (git push origin v2.1.1)
#   - a mano: pestaña Actions -> "ZIP de descarga" -> Run workflow
name: ZIP de descarga

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta a publicar (ej. v2.1.0). Vacio = la ultima."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Elegir la etiqueta
        id: version
        env:
          PEDIDA: ${{ inputs.etiqueta }}
        run: |
          if [ -n "$PEDIDA" ]; then TAG="$PEDIDA"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"
          else TAG="$(git describe --tags --abbrev=0)"; fi
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "No existe la etiqueta $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Armar ZIP por plataforma
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          make_zip() {
            platform="$1"; archive="CineConIA-Installer-$platform.zip"; stage="$(mktemp -d)"
            git archive --worktree-attributes --format=zip -o "$stage/source.zip" "$TAG"
            unzip -q "$stage/source.zip" -d "$stage/files"
            case "$platform" in
              Windows)
                rm -f "$stage/files"/Instalar-ComfyUI-Linux.sh "$stage/files"/Instalar-ComfyUI-macOS.sh "$stage/files"/Migrar-Modelos-ComfyUI.sh
                rm -f "$stage/files"/src/instalador_posix.py "$stage/files"/config/platform_profiles.json
                ;;
              Linux)
                rm -f "$stage/files"/*.bat "$stage/files"/src/bootstrap.ps1 "$stage/files"/src/progreso.ps1 "$stage/files"/src/rutas_largas.py "$stage/files"/assets/ComfyUI.ico
                ;;
              macOS)
                rm -f "$stage/files"/*.bat "$stage/files"/src/bootstrap.ps1 "$stage/files"/src/progreso.ps1 "$stage/files"/src/rutas_largas.py "$stage/files"/assets/ComfyUI.ico
                ;;
            esac
            (cd "$stage/files" && zip -qr "$GITHUB_WORKSPACE/$archive" .)
            rm -rf "$stage"
          }
          make_zip Windows
          make_zip Linux
          make_zip macOS
          cp CineConIA-Installer-Windows.zip CineConIA-Installer.zip
          for f in ComfyUI-Setup.bat ComfyUI-Advanced-Setup.bat Instalar-ComfyUI.bat src/bootstrap.ps1 src/instalador.py src/configuracion.py config/compatibility_matrix.json assets/ComfyUI.ico LICENSE; do
            unzip -l CineConIA-Installer-Windows.zip "$f" >/dev/null || { echo "Falta $f en Windows"; exit 1; }
          done
          for f in Instalar-ComfyUI-Linux.sh Migrar-Modelos-ComfyUI.sh src/instalador_posix.py src/migrar_modelos.py config/platform_profiles.json LICENSE; do
            unzip -l CineConIA-Installer-Linux.zip "$f" >/dev/null || { echo "Falta $f en Linux"; exit 1; }
          done
          for f in Instalar-ComfyUI-macOS.sh Migrar-Modelos-ComfyUI.sh src/instalador_posix.py src/migrar_modelos.py config/platform_profiles.json LICENSE; do
            unzip -l CineConIA-Installer-macOS.zip "$f" >/dev/null || { echo "Falta $f en macOS"; exit 1; }
          done
          for archive in CineConIA-Installer-Windows.zip CineConIA-Installer-Linux.zip CineConIA-Installer-macOS.zip; do
            if unzip -l "$archive" README.md >/dev/null 2>&1; then
              echo "$archive no deberia incluir README.md"; exit 1
            fi
          done

      - name: Subir a la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CineConIA-Installer.zip CineConIA-Installer-Windows.zip CineConIA-Installer-Linux.zip CineConIA-Installer-macOS.zip --clobber
          else
            gh release create "$TAG" CineConIA-Installer.zip CineConIA-Installer-Windows.zip CineConIA-Installer-Linux.zip CineConIA-Installer-macOS.zip --title "$TAG" --notes-from-tag
          fi
